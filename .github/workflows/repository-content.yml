name: Repository content policy

on: [push, pull_request]

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked public content
        run: python3 scripts/check_public_content.py --tracked

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated test image
        run: docker compose -p healthops-ci --profile test build test
      - name: Run API and PostgreSQL integration suite
        run: docker compose -p healthops-ci --profile test run --rm test
      - name: Stop isolated services
        if: always()
        run: docker compose -p healthops-ci --profile test down
