name: healthops-portfolio

# Application stack (api-service + PostgreSQL): `docker compose up --build api`.
# Data pipeline (profile "data"): `make run`, or
#   docker compose --profile data up --build --attach-dependencies data-synthesizer
# Data versions come from .env (see .env.example) and are logged by every data container.
# RAG corpus (profile "rag"): `make rag` = docker compose --profile rag run --rm --build rag-ingest
#   fetches the licence-checked reference sources, chunks and embeds them (nomic-embed-text through
#   an Ollama on the host) and stores them in pgvector inside the same PostgreSQL as the API.

x-app: &app
  build: ./src/api-service
  environment:
    HEALTHOPS_DATABASE_URL: postgresql+psycopg://healthops:local-only-password@db:5432/healthops
    HEALTHOPS_ENVIRONMENT: local

x-data: &data
  profiles: ["data"]
  # Write files as the host user so ./data stays editable and DVC can read it.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ./data:/data
    - ./configs:/configs:ro

x-data-env: &data-env
  DATA_ROOT: /data
  CONFIG_DIR: /configs
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: pgvector/pgvector:pg17  # PostgreSQL 17 with the pgvector extension (vector database)
    environment:
      POSTGRES_USER: healthops
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: healthops
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthops -d healthops"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:  # replaces the anchor's environment, so the first two lines repeat it
      HEALTHOPS_DATABASE_URL: postgresql+psycopg://healthops:local-only-password@db:5432/healthops
      HEALTHOPS_ENVIRONMENT: local
      # Assistant and RAG lookups: qwen3:8b and nomic-embed-text on an Ollama running on the host
      # (ollama pull qwen3:8b). Without Ollama the API still runs; /v1/assistant/ask reports a
      # model error.
      HEALTHOPS_ASSISTANT_MODEL_BASE_URL: ${ASSISTANT_MODEL_BASE_URL:-http://host.docker.internal:11434}
      HEALTHOPS_ASSISTANT_THINKING: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Separate ephemeral database: integration tests cannot erase the demo database.
  test-db:
    image: pgvector/pgvector:pg17  # PostgreSQL 17 with the pgvector extension (vector database)
    profiles: ["test"]
    environment:
      POSTGRES_USER: healthops
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: healthops_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthops -d healthops_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    <<: *app
    build:
      context: ./src/api-service
      args:
        INSTALL_SYNTHETIC: "true"
    profiles: ["test"]
    environment:
      HEALTHOPS_TEST_DATABASE_URL: postgresql+psycopg://healthops:test-only-password@test-db:5432/healthops_test
      HEALTHOPS_KNOWLEDGE_DIR: /knowledge
    command: ["pytest", "-q", "-p", "no:cacheprovider", "tests"]
    # Contract tests compare against the iOS fixtures of the frontend-app service; knowledge
    # tests read the corpus manifest and the project's own notes from the repository root.
    volumes:
      - ./src/frontend-app:/frontend-app:ro
      - ./knowledge:/knowledge:ro
    depends_on:
      test-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------------------
  # Operator-only cohort import. Optional parquet dependencies do not enter the API image.
  synthetic-import:
    profiles: ["synthetic"]
    build:
      context: ./src/api-service
      args:
        INSTALL_SYNTHETIC: "true"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HEALTHOPS_SYNTHETIC_DATABASE_URL: postgresql+psycopg://healthops:local-only-password@db:5432/healthops
    volumes:
      - ./data:/data:ro
      - ./src/api-service/.local/synthetic-import:/import-output
    entrypoint: ["healthops-import-synthetic"]
    command:
      - --dataset
      - /data/synthetic/${SYNTHETIC_DATA_VERSION:-synthetic-v0.1}
      - --manifest
      - /data/manifests/${SYNTHETIC_DATA_VERSION:-synthetic-v0.1}.yaml
      - --output-dir
      - /import-output/${SYNTHETIC_DATA_VERSION:-synthetic-v0.1}
      - --apply
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------------------
  # RAG pipeline (one-shot): collect sources -> chunk -> embed -> pgvector. Same image as the API,
  # so the chunker and the store are exactly what the assistant's lookup_reference tool uses.
  rag-ingest:
    <<: *app
    profiles: ["rag"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"  # downloaded texts stay editable on the host
    environment:
      HEALTHOPS_DATABASE_URL: postgresql+psycopg://healthops:local-only-password@db:5432/healthops
      HEALTHOPS_ENVIRONMENT: local
      HEALTHOPS_KNOWLEDGE_DIR: /knowledge
      HEALTHOPS_KNOWLEDGE_RAW_DIR: /knowledge-raw/raw
      # Embeddings: nomic-embed-text on an Ollama running on the host (ollama pull nomic-embed-text).
      HEALTHOPS_ASSISTANT_MODEL_BASE_URL: ${KNOWLEDGE_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./knowledge:/knowledge:ro                       # manifest + the project's own notes (Git)
      - ./src/api-service/.local/knowledge:/knowledge-raw  # third-party texts (never committed)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "python scripts/knowledge/fetch_sources.py && python scripts/knowledge/ingest.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------------------
  # Data pipeline: synthea-generator -> data-collector -> data-processor -> data-synthesizer.
  # One-shot containers; each starts only after the previous one exited successfully.
  synthea-generator:
    <<: *data
    build: ./src/synthea-generator
    environment:
      <<: *data-env
      OUTPUT_DATA_VERSION: ${RAW_DATA_VERSION:-raw-v1}

  data-collector:
    <<: *data
    build: ./src/data-collector
    environment:
      <<: *data-env
      OUTPUT_DATA_VERSION: ${RAW_DATA_VERSION:-raw-v1}
      BIDSLEEP_INCLUDE_MOTION: ${BIDSLEEP_INCLUDE_MOTION:-false}
    depends_on:
      synthea-generator:
        condition: service_completed_successfully

  data-processor:
    <<: *data
    build: ./src/data-processor
    environment:
      <<: *data-env
      INPUT_DATA_VERSION: ${RAW_DATA_VERSION:-raw-v1}
      OUTPUT_DATA_VERSION: ${CANONICAL_DATA_VERSION:-canonical-v0.1}
    depends_on:
      data-collector:
        condition: service_completed_successfully

  data-synthesizer:
    <<: *data
    build: ./src/data-synthesizer
    environment:
      <<: *data-env
      INPUT_DATA_VERSION: ${CANONICAL_DATA_VERSION:-canonical-v0.1}
      OUTPUT_DATA_VERSION: ${SYNTHETIC_DATA_VERSION:-synthetic-v0.1}
      # LLM for context generation: Ollama on the host by default. If it is not running or the
      # model is not pulled, the run logs why and uses the seed event library. "off" disables it.
      CONTEXT_LLM_BASE_URL: ${CONTEXT_LLM_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach an Ollama running on the host
    depends_on:
      data-processor:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------------------
  # Model training (profile "train"): cross-device reconciliation models on a synthetic version.
  # `make train-smoke` runs the three models on 20 users with tiny settings; the same image is
  # the Vertex AI custom job. W&B goes online when WANDB_API_KEY is set in .env, offline otherwise.
  model-training:
    build: ./src/model-training
    profiles: ["train"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATA_ROOT: /data
      TRAIN_DATA_VERSION: ${SYNTHETIC_DATA_VERSION:-synthetic-v0.2}
      TRAIN_MODELS: ${TRAIN_MODELS:-lightgbm,transformer,diffusion}
      TRAIN_USERS: ${TRAIN_USERS:-0}
      TRAIN_SMOKE: ${TRAIN_SMOKE:-false}
      TRAIN_OUT: ${TRAIN_OUT:-}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      WANDB_MODE: ${WANDB_MODE:-}
      WANDB_PROJECT: ${WANDB_PROJECT:-healthops-m3}
      WANDB_ENTITY: ${WANDB_ENTITY:-}
      WANDB_DIR: /app/.local/wandb
      HOME: /tmp
    volumes:
      - ./data:/data:ro
      - ./src/model-training/.local:/app/.local   # runs, models, offline W&B files

volumes:
  postgres_data:
