# Missing-data mechanisms per provider (data-synthesizer). Every dropped record is logged
# in missingness_events.parquet so evaluations know the ground truth.
#
#   not_worn_day        whole day missing (single day)
#   multi_day_gap       consecutive days missing; length ~ 1 + geometric(mean_length_days - 1)
#   sync_failure        all records in a short window never reach the server
#   battery_depletion   records after a local hour are missing, and that night too
#   overnight_not_worn  the night's sleep (and HRV) is missing
#   metric_dropout      one metric missing on a day while others are present
#   sample_dropout      individual heart-rate samples missing (Apple Watch only)

healthkit:
  not_worn_day: {probability: 0.03}
  multi_day_gap: {start_probability: 0.01, mean_length_days: 3}
  sync_failure: {probability: 0.01, length_days: [1, 3]}
  battery_depletion: {probability: 0.05, earliest_hour: 16, latest_hour: 22}
  overnight_not_worn: {probability: 0.10}
  metric_dropout:
    resting_heart_rate: 0.05
    hrv_sdnn: 0.15
    exercise_duration: 0.0
  sample_dropout: {probability: calibrated}

google_health:
  not_worn_day: {probability: calibrated}
  multi_day_gap: {start_probability: calibrated, mean_length_days: calibrated}
  sync_failure: {probability: 0.01, length_days: [1, 3]}
  battery_depletion: {probability: 0.02, earliest_hour: 12, latest_hour: 22}
  overnight_not_worn: {probability: calibrated}
  metric_dropout:
    resting_heart_rate: 0.05
    hrv_rmssd: 0.10
    heart_rate: 0.0
