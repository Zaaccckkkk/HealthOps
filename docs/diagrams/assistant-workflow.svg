<svg xmlns="http://www.w3.org/2000/svg" width="960" height="990" viewBox="0 0 960 990" role="img" aria-labelledby="title desc">
<title id="title">HealthOps assistant request flow</title>
<desc id="desc">LangGraph intake asks for missing context or rejects unsupported requests. Ready requests enter the Qwen tool loop. Scoped tools return evidence; state_findings enters deterministic verification, with at most one verification correction before the server renders a response. Clarification state and health evidence use PostgreSQL.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#44403c"/></marker></defs>
<rect width="960" height="990" rx="12" fill="#faf9f6"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#242424}.title{font-size:21px;font-weight:700}.body{font-size:17px}.label{font-size:15px;fill:#57534e}.edge{fill:none;stroke:#44403c;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}.node{fill:#ffffff;stroke:#292524;stroke-width:1.8}</style>
<path class="edge" d="M470 94 V130"/>
<path class="edge" d="M330 170 H150 V235"/>
<path class="edge" d="M270 295 H302 V200 H330"/>
