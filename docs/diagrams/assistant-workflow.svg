</text>
<text x="485" y="285" class="label" text-anchor="start">
<tspan x="485" dy="0">Ready request</tspan>
</text>
<text x="155" y="438" class="label" text-anchor="start">
<tspan x="155" dy="0">Tool call</tspan>
</text>
<text x="230" y="480" class="label" text-anchor="middle">
<tspan x="230" dy="0">Evidence cards</tspan>
</text>
<text x="160" y="666" class="label" text-anchor="start">
<tspan x="160" dy="0">Read scoped data</tspan>
</text>
<text x="480" y="555" class="label" text-anchor="start">
<tspan x="480" dy="0">state_findings</tspan>
</text>
<text x="675" y="545" class="label" text-anchor="start">
<tspan x="675" dy="0">At most one</tspan>
<tspan x="675" dy="23">verification correction</tspan>
</text>
<text x="480" y="801" class="label" text-anchor="start">
