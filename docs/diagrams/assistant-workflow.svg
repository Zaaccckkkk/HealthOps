<tspan x="470.0" dy="0">LangGraph intake</tspan>
</text>
<text x="470.0" y="185" class="body" text-anchor="middle">
<tspan x="470.0" dy="0">Router + request scope</tspan>
</text>
<rect class="node" x="30" y="235" width="240" height="100" rx="10"/>
<text x="150.0" y="264" class="title" text-anchor="middle">
<tspan x="150.0" dy="0">Ask for clarification</tspan>
</text>
<text x="150.0" y="290" class="body" text-anchor="middle">
<tspan x="150.0" dy="0">Save state in PostgreSQL</tspan>
<tspan x="150.0" dy="23">Resume with user reply</tspan>
</text>
<rect class="node" x="685" y="235" width="220" height="84" rx="10"/>
<text x="795.0" y="264" class="title" text-anchor="middle">
<tspan x="795.0" dy="0">Unsupported</tspan>
</text>
<text x="795.0" y="290" class="body" text-anchor="middle">
<tspan x="795.0" dy="0">Explain the limitation</tspan>
</text>
<rect class="node" x="330" y="365" width="280" height="86" rx="10"/>
<text x="470.0" y="394" class="title" text-anchor="middle">
<tspan x="470.0" dy="0">Qwen3-8B</tspan>
</text>
<text x="470.0" y="420" class="body" text-anchor="middle">
