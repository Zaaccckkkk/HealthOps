[project]
name = "healthops-synthea-generator"
version = "0.1.0"
description = "Runs Synthea to create synthetic patients for a raw data version"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[project.scripts]
synthea-generator = "generator.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
