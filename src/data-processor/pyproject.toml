[project]
name = "healthops-data-processor"
version = "0.1.0"
description = "Maps a raw data version onto the HealthOps canonical schema (parquet)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<2.5",  # pandas 2.3 emits timedelta deprecation warnings with numpy 2.5
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pyyaml>=6.0,<7",
  "scipy>=1.13,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
data-processor = "processor.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["processor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
