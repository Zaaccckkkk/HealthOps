[project]
name = "healthops-ml-workflow"
version = "0.1.0"
description = "Vertex AI Pipeline for the reconciliation models: prepare -> train (GPU, in parallel) -> compare"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kfp>=2.9,<3",
  "google-cloud-pipeline-components>=2.16,<3",
  "google-cloud-aiplatform>=1.70,<2",
  "google-cloud-secret-manager>=2.20,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
healthops-pipeline = "pipeline.submit:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
