[project]
name = "healthops-data-collector"
version = "0.1.0"
description = "Downloads and verifies the real wearable datasets into a raw data version"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[project.scripts]
data-collector = "collector.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
