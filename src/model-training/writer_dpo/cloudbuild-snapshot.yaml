# CPU-only preparation; context contains writer_dpo/ without data or weights.
steps:
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install --no-cache-dir --require-hashes -r writer_dpo/cloud-requirements.txt
        pip install --no-cache-dir huggingface_hub==1.32.0
        HF_HUB_DISABLE_PROGRESS_BARS=1 python -m writer_dpo.snapshot --output /workspace/.local/qwen3-8b --gcs-uri '${_SNAPSHOT_URI}'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 1800s
